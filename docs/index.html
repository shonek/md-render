    <style>
      :root {
        --sidebar-bg: #1f2937;
        --sidebar-text: #cbd5e1;
        --sidebar-text-dim: #94a3b8;
        --sidebar-active-bg: #111827;
        --sidebar-active-border: #2b5fd6;
        --accent: #2b5fd6;
        --bg: #ffffff;
        --text: #1f2329;
        --text-dim: #646a73;
        --border: #d0d7de;
        --code-bg: #f6f8fa;
        --warn-bg: #fff8c5;
        --warn-border: #d4a72c;
        --err-bg: #ffebe9;
        --err-border: #cf222e;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
        color: var(--text);
        background: var(--bg);
        line-height: 1.65;
      }

      /* ---------- layout ---------- */
      .layout {
        display: flex;
        min-height: 100vh;
      }

      .sidebar {
        width: 260px;
        background: var(--sidebar-bg);
        color: var(--sidebar-text);
        position: fixed;
        inset: 0 auto 0 0;
        padding: 20px 0;
        overflow-y: auto;
        z-index: 10;
      }
      .sidebar h1 {
        font-size: 18px;
        font-weight: 600;
        color: #fff;
        margin: 0 20px 18px;
        padding: 6px 0 14px;
        border-bottom: 1px solid #374151;
        letter-spacing: 0.5px;
      }
      .menu {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .menu li a {
        display: block;
        color: var(--sidebar-text);
        text-decoration: none;
        padding: 11px 20px;
        border-left: 3px solid transparent;
        font-size: 14px;
        line-height: 1.5;
        /* 单行省略；超长名称 hover 时通过 title 属性看完整文本 */
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        transition:
          background 0.12s,
          color 0.12s;
      }
      .menu li a:hover {
        background: rgba(255, 255, 255, 0.04);
        color: #fff;
      }
      .menu li a.active {
        background: var(--sidebar-active-bg);
        border-left-color: var(--sidebar-active-border);
        color: #fff;
        font-weight: 500;
      }

      /* ---------- multi-level menu: submenu indent + group header ---------- */
      /* 嵌套子菜单：缩进 36px，字体略小 */
      .menu .submenu {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .menu .submenu li a {
        padding-left: 36px;
        font-size: 13px;
      }
      /* 分组标题：button 化，点击折叠/展开；caret 旋转作视觉指示。
         padding-left 设为 20px，让 caret 起点与 .menu li a 的文字起点（20px）对齐；
         name 落在 caret(10) + gap(6) = 36px 起，子菜单 padding-left: 36px 与之对齐。
         line-height 显式设为 1.5，与 .menu li a 一致；不靠 body 继承 1.65，
         否则 flex 容器里 caret(9px) 和 name(14px) 各自算出不同 line-box，视觉高度飘。 */
      .menu .menu-group {
        display: flex;
        align-items: center;
        gap: 6px;
        width: 100%;
        padding: 11px 20px;
        margin: 0;
        background: transparent;
        border: none;
        color: var(--sidebar-text-dim);
        font-size: 14px;
        font-weight: 600;
        line-height: 1.5;
        letter-spacing: 0.4px;
        cursor: pointer;
        user-select: none;
        text-align: left;
        font-family: inherit;
      }
      .menu .menu-group:hover {
        color: #fff;
      }
      .menu .menu-group:focus {
        outline: none;
        color: #fff;
      }
      .menu .menu-group:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }
      .menu .menu-group-caret {
        display: inline-block;
        width: 10px;
        font-size: 10px;
        flex: 0 0 auto;
        transition: transform 0.15s ease;
      }
      .menu .menu-group-name {
        flex: 1 1 auto;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      /* 折叠态：caret 旋成 ▶，子菜单隐藏。
         caret 不是 li 的直接子（在 button 里），用后代选择器。 */
      .menu-group-item.collapsed .menu-group-caret {
        transform: rotate(-90deg);
      }
      .menu-group-item.collapsed > .submenu {
        display: none;
      }

      .main {
        margin-left: 260px;
        flex: 1;
        padding: 32px 48px 80px;
        max-width: calc(100% - 260px);
      }

      /* ---------- markdown body ---------- */
      .markdown-body {
        max-width: 1100px;
      }
      .markdown-body h1,
      .markdown-body h2,
      .markdown-body h3,
      .markdown-body h4 {
        margin-top: 1.6em;
        margin-bottom: 0.6em;
        font-weight: 600;
        line-height: 1.3;
      }
      .markdown-body h1 {
        font-size: 26px;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--border);
      }
      .markdown-body h2 {
        font-size: 21px;
        padding-bottom: 6px;
        border-bottom: 1px solid var(--border);
      }
      .markdown-body h3 {
        font-size: 17px;
      }
      .markdown-body h4 {
        font-size: 15px;
      }
      .markdown-body p {
        margin: 0.8em 0;
      }
      .markdown-body a {
        color: var(--accent);
        text-decoration: none;
      }
      .markdown-body a:hover {
        text-decoration: underline;
      }
      .markdown-body ul,
      .markdown-body ol {
        padding-left: 1.6em;
      }
      .markdown-body li {
        margin: 0.3em 0;
      }

      .markdown-body blockquote {
        margin: 1em 0;
        padding: 0.6em 1em;
        color: var(--text-dim);
        border-left: 4px solid var(--border);
        background: #fafbfc;
      }

      .markdown-body code {
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono",
          monospace;
        font-size: 0.88em;
        background: var(--code-bg);
        padding: 2px 6px;
        border-radius: 4px;
      }
      .markdown-body pre {
        background: var(--code-bg);
        padding: 14px 16px;
        border-radius: 8px;
        overflow: auto;
        font-size: 0.88em;
        line-height: 1.5;
      }
      .markdown-body pre code {
        background: transparent;
        padding: 0;
        font-size: inherit;
      }

      .markdown-body table {
        border-collapse: collapse;
        margin: 1em 0;
        font-size: 0.92em;
        width: auto;
        max-width: 100%;
      }
      .markdown-body th,
      .markdown-body td {
        border: 1px solid var(--border);
        padding: 6px 12px;
        text-align: left;
      }
      .markdown-body th {
        background: var(--code-bg);
        font-weight: 600;
      }
      .markdown-body tr:nth-child(even) td {
        background: #fafbfc;
      }

      /* ---------- diagrams (mermaid + plantuml share these) ---------- */
      .diagram-box {
        position: relative;
        margin: 1.6em 0;
        background: #fcfcfd;
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden; /* clip panned content */
        height: 520px; /* MUST be explicit; panzoom transforms child */
        resize: vertical; /* user can drag taller */
        min-height: 240px;
      }
      .diagram-inner {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: grab;
        user-select: none;
      }
      .diagram-inner:active {
        cursor: grabbing;
      }
      /* override mermaid's max-width:100% so panzoom transforms aren't clipped */
      .diagram-inner svg,
      .diagram-inner img {
        max-width: none;
        max-height: none;
        display: block;
      }
      .diagram-inner img {
        user-select: none;
        -webkit-user-drag: none;
      }

      .diagram-toolbar {
        position: absolute;
        top: 8px;
        right: 8px;
        z-index: 5;
        display: flex;
        gap: 4px;
        background: rgba(255, 255, 255, 0.92);
        padding: 4px;
        border-radius: 6px;
        border: 1px solid var(--border);
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
      }
      .diagram-toolbar button {
        width: 28px;
        height: 28px;
        border: 1px solid var(--border);
        background: #fff;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
        line-height: 1;
        color: var(--text);
      }
      .diagram-toolbar button:hover {
        background: var(--code-bg);
      }
      .diagram-toolbar button.reset {
        width: auto;
        padding: 0 8px;
        font-size: 12px;
      }
      .diagram-hint {
        position: absolute;
        bottom: 6px;
        right: 10px;
        z-index: 4;
        font-size: 11px;
        color: var(--text-dim);
        background: rgba(255, 255, 255, 0.85);
        padding: 2px 6px;
        border-radius: 4px;
        pointer-events: none;
      }

      /* ---------- html code blocks (rendered in sandboxed iframe) ---------- */
      /* 宿主页只负责外壳（边框/标题栏），HTML 内容的样式都在 shadow 内部，
     既不继承也不影响宿主页，达到双向样式隔离。 */
      .html-box {
        margin: 1.6em 0;
        background: #fcfcfd;
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
      }
      .html-box-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 6px 12px;
        background: #f6f8fa;
        border-bottom: 1px solid var(--border);
        font-size: 12px;
      }
      .html-box-header .label {
        font-weight: 600;
        color: var(--text);
        letter-spacing: 0.4px;
      }
      .html-toolbar {
        display: flex;
        gap: 4px;
      }
      .html-toolbar button {
        height: 24px;
        padding: 0 10px;
        border: 1px solid var(--border);
        background: #fff;
        border-radius: 4px;
        cursor: pointer;
        font-size: 12px;
        color: var(--text);
      }
      .html-toolbar button:hover {
        background: #fff;
        border-color: var(--accent);
        color: var(--accent);
      }
      .html-render {
        width: 100%;
        min-height: 480px;
        border: none;
        display: block;
        background: #fff;
      }

      /* ---------- loading / empty / error states ---------- */
      .loading,
      .empty {
        padding: 60px 20px;
        text-align: center;
        color: var(--text-dim);
      }
      .empty h2 {
        color: var(--text);
        margin: 0 0 12px;
        border: none;
        padding: 0;
        font-size: 20px;
      }
      .empty p {
        margin: 8px 0;
      }
      .empty code {
        background: var(--code-bg);
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 0.95em;
      }
      .empty .warn {
        background: var(--warn-bg);
        border: 1px solid var(--warn-border);
        border-radius: 8px;
        padding: 14px 18px;
        margin: 18px auto 0;
        max-width: 640px;
        text-align: left;
        color: #57410d;
      }

      .err-box {
        margin: 1.6em 0;
        padding: 14px 18px;
        background: var(--err-bg);
        border: 1px solid var(--err-border);
        border-radius: 8px;
        color: #82071e;
      }
      .err-box details {
        margin-top: 8px;
        font-size: 0.9em;
      }
      .err-box summary {
        cursor: pointer;
        color: var(--err-border);
      }
      .err-box pre {
        background: rgba(0, 0, 0, 0.04);
        margin-top: 8px;
        padding: 8px 10px;
        border-radius: 4px;
        overflow: auto;
        max-height: 220px;
      }

      /* ---------- disclaimer (PlantUML third-party) ---------- */
      .disclaimer {
        margin: 1em 0 1.4em;
        padding: 10px 14px;
        background: #f0f7ff;
        border: 1px solid #b6d4fe;
        border-radius: 6px;
        color: #084c8d;
        font-size: 13px;
      }

      /* small screens: stack layout instead of squeezing sidebar */
      @media (max-width: 720px) {
        .layout {
          flex-direction: column;
        }
        .sidebar {
          position: relative;
          width: 100%;
          inset: auto;
          padding: 12px 0;
        }
        .main {
          margin-left: 0;
          max-width: 100%;
          padding: 20px 18px 60px;
        }
        /* 改回 block 列表：嵌套子菜单不能塞进 flex 否则会被拍平 */
        .menu {
          padding: 0 12px;
        }
        .menu li a {
          padding: 8px 20px;
          border-left: none;
          border-bottom: 3px solid transparent;
        }
        /* 移动端：caret 起点同样与 .menu li a 文字起点（20px）对齐；
           只把垂直 padding 收到 8px 跟普通项保持一致；水平 padding 和 caret 一律不缩水。 */
        .menu .menu-group {
          padding: 8px 20px;
        }
        .menu .submenu li a {
          padding-left: 24px;
          font-size: 13px;
        }
        .menu li a.active {
          border-left: none;
          border-bottom-color: var(--sidebar-active-border);
        }
        /* 嵌套项用左边框作 active 指示，避免和顶层共用底部边框造成错位 */
        .menu .submenu li a.active {
          border-bottom-color: transparent;
          border-left: 3px solid var(--sidebar-active-border);
          padding-left: 21px;
        }
      }
    </style>
  </head>
  <body>

      <aside class="sidebar">
        <h1>OMSxitong</h1>
        <ul class="menu" id="menu"></ul>
      </aside>

      <main class="main">
        <div id="content" class="markdown-body">
          <div class="loading">加载中…</div>
        </div>
      </main>
    </div>

      {
        "name": "测试HTML",
        "content": "```html\n<div class=\"api-mindmap\">\n<style>\n.api-mindmap{font-family:-apple-system,\"Segoe UI\",sans-serif;font-size:13px;color:#1f2937}\n.api-mindmap .mm-tabs{display:flex;gap:8px;border-bottom:1px solid #e5e7eb;margin-bottom:10px}\n.api-mindmap .mm-tab{padding:6px 14px;border-radius:8px 8px 0 0;background:#f1f5f9;color:#475569;font-weight:600}\n.api-mindmap .mm-tab.active{background:#1e293b;color:#fff}\n.api-mindmap .mm-toolbar{display:flex;align-items:center;gap:8px;margin:8px 0 12px;flex-wrap:wrap}\n.api-mindmap .mm-btn{padding:4px 10px;border:1px solid #cbd5e1;background:#fff;border-radius:6px;cursor:pointer;font-size:12px;color:#334155}\n.api-mindmap .mm-btn:hover{background:#f8fafc}\n.api-mindmap .mm-hint{margin-left:auto;color:#94a3b8;font-size:12px}\n.api-mindmap .mindtree details{display:flex;flex-direction:row;align-items:flex-start;margin:6px 0}\n.api-mindmap .mindtree details>summary{list-style:none;cursor:pointer;flex:0 0 auto;min-width:150px;max-width:260px;padding:8px 12px;border-radius:10px;border:1px solid #e2e8f0;box-shadow:0 1px 2px rgba(0,0,0,.05);position:relative}\n.api-mindmap .mindtree details>summary::-webkit-details-marker{display:none}\n.api-mindmap .mindtree summary .ind{margin-right:6px;font-size:11px;color:#64748b}\n.api-mindmap .mindtree .kids{display:flex;flex-direction:column;margin-left:20px;padding-left:14px;border-left:1px dashed #cbd5e1}\n.api-mindmap .mindtree ul.leaves{margin:6px 0 0;padding-left:18px}\n.api-mindmap .mindtree ul.leaves li{margin:4px 0;padding:5px 10px;border-radius:8px;background:#f8fafc;border:1px solid #e2e8f0;max-width:300px}\n.api-mindmap .mindtree .code{font-family:ui-monospace,Consolas,monospace;font-size:12px}\n.api-mindmap .mindtree .desc{display:block;color:#64748b;font-size:11px;margin-top:2px}\n.api-mindmap .d0>summary{background:#1e293b;color:#fff;border-color:#1e293b}\n.api-mindmap .d1>summary{background:#dbeafe;color:#1e3a8a;border-color:#bfdbfe}\n.api-mindmap .d2>summary{background:#fef9c3;color:#854d0e;border-color:#fde68a}\n.api-mindmap .d3>summary{background:#dcfce7;color:#166534;border-color:#bbf7d0}\n.api-mindmap .d4>summary{background:#fce7f3;color:#9d174d;border-color:#f9d3e0}\n.api-mindmap .cond>summary{background:#fff7ed;color:#9a3412;border-color:#fed7aa;border-style:dashed}\n</style>\n\n<div class=\"mm-tabs\"><span class=\"mm-tab active\">横向下钻树</span><span class=\"mm-tab\">Mermaid 平铺图</span></div>\n<div class=\"mm-toolbar\">\n  <button class=\"mm-btn\" onclick=\"mmExpandAll(this)\">全部展开</button>\n  <button class=\"mm-btn\" onclick=\"mmCollapseAll(this)\">全部折叠</button>\n  <button class=\"mm-btn\" onclick=\"mmExpandTo(this,2)\">展开到第2层</button>\n  <button class=\"mm-btn\" onclick=\"mmExpandTo(this,3)\">展开到第3层</button>\n  <span class=\"mm-hint\">点击 ▾ 折叠/展开，从左到右横向下钻…</span>\n</div>\n\n<div class=\"mindtree\" id=\"mindtree-salesorderssave-001\">\n<details class=\"d0\" open>\n  <summary><span class=\"ind\">▾</span><b>SalesOrderController.save</b><span class=\"desc\">HTTP 入口，批量保存销售订单</span></summary>\n  <div class=\"kids\">\n\n    <details class=\"d1\" open>\n      <summary><span class=\"ind\">▾</span><span class=\"code\">入口层</span><span class=\"desc\">路由/请求/转换</span></summary>\n      <div class=\"kids\">\n        <ul class=\"leaves\">\n          <li><span class=\"code\">POST /sales-orders/save</span><span class=\"desc\">HTTP 路由</span></li>\n          <li><span class=\"code\">SalesOrderBatchSaveRequest</span><span class=\"desc\">批量请求 DTO，含 saveRequests 列表</span></li>\n          <li><span class=\"code\">SalesOrderSaveDTOConverter.convert</span><span class=\"desc\">请求转 SaveDTO，componentOrderName→opportunityNo</span></li>\n          <li><span class=\"code\">SalesOrderBatchSaveResponseConverter.convert</span><span class=\"desc\">结果转批量响应 DTO</span></li>\n        </ul>\n      </div>\n    </details>\n\n    <details class=\"d1\" open>\n      <summary><span class=\"ind\">▾</span><span class=\"code\">SalesOrderApplicationService.batchSave</span><span class=\"desc\">事务外编排，并行保存多条 SO</span></summary>\n      <div class=\"kids\">\n\n        <details class=\"d2\" open>\n          <summary><span class=\"ind\">▾</span><span class=\"code\">SecurityContextHolder.getCurrentEmployeeNumber</span><span class=\"desc\">获取当前操作人工号</span></summary>\n          <div class=\"kids\">\n            <ul class=\"leaves\">\n              <li><span class=\"code\">saveDto.setStatus(INPUTTED)</span><span class=\"desc\">置为已录入状态</span></li>\n              <li><span class=\"code\">setOperatorId / setSerialNo / setCreatedAt</span><span class=\"desc\">填充操作人、序号、时间</span></li>\n            </ul>\n          </div>\n        </details>\n\n        <details class=\"d2\" open>\n          <summary><span class=\"ind\">▾</span><span class=\"code\">CompletableFuture.runAsync</span><span class=\"desc\">线程池并行处理每条 SO</span></summary>\n          <div class=\"kids\">\n            <details class=\"d3\" open>\n              <summary><span class=\"ind\">▾</span><span class=\"code\">saveSo</span><span class=\"desc\">单条 SO 保存+推 ERP 编排</span></summary>\n              <div class=\"kids\">\n\n                <details class=\"d4\" open>\n                  <summary><span class=\"ind\">▾</span><span class=\"code\">save（@Transactional）</span><span class=\"desc\">事务内落库</span></summary>\n                  <div class=\"kids\">\n                    <ul class=\"leaves\">\n                      <li><span class=\"code\">buildOrderOtherInfo</span><span class=\"desc\">查履约/组件订单、税率构建主单号</span></li>\n                      <li><span class=\"code\">SalesOrder.create</span><span class=\"desc\">领域聚合组装订单头</span></li>\n                      <li><span class=\"code\">SEQUENCE.nextNo（Snowflake）</span><span class=\"desc\">新增时生成主键</span></li>\n                      <li><span class=\"code\">salesOrderRepository.save</span><span class=\"desc\">订单头入库</span></li>\n                      <li><span class=\"code\">SalesOrder.createSpecialStorageRoute</span><span class=\"desc\">构建特殊仓储路线</span></li>\n                      <li><span class=\"code\">storageRouteRepository.save</span><span class=\"desc\">特殊仓储路线入库</span></li>\n                      <li><span class=\"code\">SalesOrder.createLine</span><span class=\"desc\">构建订单行（新增/更新/软删）</span></li>\n                      <li><span class=\"code\">salesOrderLineRepository.batchSave</span><span class=\"desc\">订单行批量入库</span></li>\n                      <li><span class=\"code\">salesOrderLineRepository.batchDelByIds</span><span class=\"desc\">软删已移除的订单行</span></li>\n                    </ul>\n                  </div>\n                </details>\n\n                <details class=\"d4 cond\" open>\n                  <summary><span class=\"ind\">▾</span>🔧 条件：<span class=\"code\">erpPaymentType</span> 是否为空</summary>\n                  <div class=\"kids\">\n                    <details class=\"d3\" open>\n                      <summary><span class=\"ind\">▾</span>为空 → 标记 ERROR 分支</summary>\n                      <div class=\"kids\">\n                        <ul class=\"leaves\">\n                          <li><span class=\"code\">salesOrder.updateStatus(ERROR)</span><span class=\"desc\">置错误状态</span></li>\n                          <li><span class=\"code\">salesOrderRepository.updateStatus</span><span class=\"desc\">回写错误状态</span></li>\n                        </ul>\n                      </div>\n                    </details>\n                    <details class=\"d3\" open>\n                      <summary><span class=\"ind\">▾</span>非空 → 推 ERP 分支</summary>\n                      <div class=\"kids\">\n                        <ul class=\"leaves\">\n                          <li><span class=\"code\">erpSalesOrderRepository.saveToErp</span><span class=\"desc\">转换 DTO 并推 ERP 保存</span></li>\n                          <li><span class=\"code\">ErpServiceClient.saveSalesOrder</span><span class=\"desc\">调用 ErpFeignClient.saveSalesOrder</span></li>\n                          <li><span class=\"code\">salesOrderRepository.updateOrderNo</span><span class=\"desc\">回写 ERP 单号</span></li>\n                        </ul>\n                      </div>\n                    </details>\n                  </div>\n                </details>\n\n                <details class=\"d4\" open>\n                  <summary><span class=\"ind\">▾</span><span class=\"code\">ERP 后续动作</span><span class=\"desc\">推 ERP 成功后的附加处理</span></summary>\n                  <div class=\"kids\">\n                    <ul class=\"leaves\">\n                      <li><span class=\"code\">erpSalesOrderRepository.autoShipment（@Async）</span><span class=\"desc\">ERP 自动发运处理</span></li>\n                      <li><span class=\"code\">erpSalesOrderRepository.saveSpecialStorageRouteToErp</span><span class=\"desc\">特殊仓储路线推 ERP</span></li>\n                      <li><span class=\"code\">storageRouteRepository.updateTaxRoute</span><span class=\"desc\">回写税务路线 ID</span></li>\n                    </ul>\n                  </div>\n                </details>\n\n              </div>\n            </details>\n          </div>\n        </details>\n\n        <details class=\"d2 cond\" open>\n          <summary><span class=\"ind\">▾</span>🔧 条件：<span class=\"code\">errors</span> 是否非空</summary>\n          <div class=\"kids\">\n            <details class=\"d3\" open>\n              <summary><span class=\"ind\">▾</span>有错误 → 抛批量异常</summary>\n              <div class=\"kids\">\n                <ul class=\"leaves\">\n                  <li><span class=\"code\">throw BusinessException 批量保存部分失败</span><span class=\"desc\">汇总各条错误抛出</span></li>\n                </ul>\n              </div>\n            </details>\n            <details class=\"d3\" open>\n              <summary><span class=\"ind\">▾</span>无错误 → 异步回查 ERP</summary>\n              <div class=\"kids\">\n                <ul class=\"leaves\">\n                  <li><span class=\"code\">erpSalesOrderRepository.querySalesOrdersFormErpAsync</span><span class=\"desc\">@Async 异步回查 ERP 订单</span></li>\n                </ul>\n              </div>\n            </details>\n          </div>\n        </details>\n\n      </div>\n    </details>\n\n    <details class=\"d1\" open>\n      <summary><span class=\"ind\">▾</span><span class=\"code\">外部依赖</span><span class=\"desc\">Feign 客户端调用</span></summary>\n      <div class=\"kids\">\n        <ul class=\"leaves\">\n          <li><span class=\"code\">MasterDataFeignClient</span><span class=\"desc\">主数据：getSalesTaxRateById/ByName、queryAccountNameMap</span></li>\n          <li><span class=\"code\">DeliveryFeignClient</span><span class=\"desc\">履约：fulfillmentListByIds、getFulfillmentOrdersById、getDeliveryOrderDetailById</span></li>\n          <li><span class=\"code\">ErpFeignClient.saveSalesOrder</span><span class=\"desc\">ERP：保存/更新销售订单</span></li>\n          <li><span class=\"code\">ShipFeignClient</span><span class=\"desc\">发货通知服务（关联场景使用）</span></li>\n        </ul>\n      </div>\n    </details>\n\n    <details class=\"d1\" open>\n      <summary><span class=\"ind\">▾</span><span class=\"code\">异步下发（@Async）</span><span class=\"desc\">主流程完成后的异步任务</span></summary>\n      <div class=\"kids\">\n        <ul class=\"leaves\">\n          <li><span class=\"code\">querySalesOrdersFormErpAsync</span><span class=\"desc\">@Async 异步回查 ERP 订单及关联单</span></li>\n          <li><span class=\"code\">syncSoAndRefOrderFormErpAsync</span><span class=\"desc\">异步同步 SO 与关联订单回写</span></li>\n          <li><span class=\"code\">autoShipment</span><span class=\"desc\">@Async ERP 自动发运处理</span></li>\n        </ul>\n      </div>\n    </details>\n\n  </div>\n</details>\n</div>\n\n<script>\n(function(){\n  var root=document.getElementById('mindtree-salesorderssave-001');\n  if(!root) return;\n  function setInd(d){var s=d.querySelector(':scope>summary .ind');if(s){s.textContent=d.hasAttribute('open')?'▾':'▸';}}\n  function refreshAll(){root.querySelectorAll('details').forEach(setInd);}\n  function depthOf(d){var n=0,p=d;while(p&&p!==root){if(p.tagName==='DETAILS')n++;p=p.parentElement;}return n;}\n  window.mmExpandAll=function(b){root.querySelectorAll('details').forEach(function(d){d.setAttribute('open','');});refreshAll();};\n  window.mmCollapseAll=function(b){root.querySelectorAll('details').forEach(function(d){d.removeAttribute('open');});refreshAll();};\n  window.mmExpandTo=function(b,n){root.querySelectorAll('details').forEach(function(d){if(depthOf(d)<=n){d.setAttribute('open','');}else{d.removeAttribute('open');}});refreshAll();};\n  root.addEventListener('toggle',refreshAll,{capture:true});\n  refreshAll();\n})();\n<\/script>\n```",

        "content": "﻿# POST /shipment-notice/save 接口时序图\n\n> **所属微服务**：`oms-ship-notice`\n> **入口方法**：`ShipmentNoticeController.add`（`@PostMapping(\"/save\")`，对应应用层 `ShipmentNoticeApplicationService.save`）\n> **codegraph 路由**：`POST /shipment-notice/save`\n> **分析来源**：codegraph（`E:\\OMSCODE\\oms-ship-notice`）\n> **生成时间**：2026-09-03\n> **输出路径**：`逆向知识库/API序列图/oms-ship-notice/shipment-notice-save.md`\n\n## 一、API 时序总体概览\n\n`POST /shipment-notice/save` 是发货通知单「添加」接口，接收 `ShipmentNoticeSaveRequest`，返回 `R<ShipmentNoticeResponse>`。接口为**纯同步流程**，无 AFTER_COMMIT 异步分发：\n\n- **同步主路径**：Controller 将请求转为 `ShipmentNoticeSaveDTO` 后调用 `ShipmentNoticeApplicationService.save`（`@Transactional(rollbackFor = Exception.class)`）。`save` 先通过 `deliveryFeignClient` 查询履约订单（补全交付订单/客户/账套等字段），再通过 `masterDataFeignClient` 生成流水号，然后委托 `doSave` 完成头/行落库与发货数量功率校验。\n- **事务范围**：`save` 整体 `@Transactional`，覆盖履约订单查询、流水号生成、头表插入、发货通知-组件订单关联关系插入、行表批量插入、发货数量与功率校验；事务内含对 `oms-deliv-order`（`DeliveryFeignClient`）与主数据（`MasterDataFeignClient`）的远程调用。\n- **主路径一句话**：Client → Controller → save（@Transactional：查履约订单 Feign + 生成流水号 Feign → doSave 落库头/关联/行 → 校验发货数量功率 Feign+DB）→ 返回。\n- **外部依赖**：`DeliveryFeignClient`（调 `oms-deliv-order`：`getListByOrderNos` 查履约订单、`getFoById` 查履约详情、`getFoLineList` 查履约订单行）、`MasterDataFeignClient`（主数据：`generateShipmentNoticeSerialNumber` 生成流水号）。\n\n### 1.1 参与者一览\n\n| 参与者 | 类型 | 别名 | 职责 |\n|--------|------|------|------|\n| 调用方 | Actor | Client | HTTP 调用方，提交发货通知保存请求 |\n| ShipmentNoticeController | boundary | Ctrl | 接入层，`/save` 入口，DTO 转换与响应封装 |\n| ShipmentNoticeApplicationService | control | App | 应用编排，`save`/`doSave` 落库与校验 |\n| ShipmentNotice | entity | Domain | 领域聚合根，`create`/`generateOrderNo`/`createLine`/`checkIsParentOrder` |\n| ShipmentNoticeLine | entity | LineDomain | 行领域，`create` |\n| ShipmentNoticeDelivery | entity | DeliveryRel | 发货通知-组件订单关联，`createByShipmentNotice` |\n| ShipmentNoticeRepository | repository | Repo | 头仓储，`save`/`getId` |\n| ShipmentNoticeLineRepository | repository | LineRepo | 行仓储，`batchAdd`/`getList`/`listByFulfillmentOrderId` |\n| ShipmentNoticeDeliveryRepository | repository | DeliveryRepo | 关联仓储，`batchInsert` |\n| DeliveryFeignClient | system | DeliveryFeign | 履约订单 Feign（调 `oms-deliv-order`） |\n| MasterDataFeignClient | system | MasterData | 主数据 Feign：流水号生成 |\n| DB | database | DB | OMS 数据库（shipment_notice / _line / _delivery） |\n\n### 1.2 主路径摘要\n\n1. Client 提交 `POST /shipment-notice/save` + `ShipmentNoticeSaveRequest`。\n2. Controller 调 `shipmentNoticeSaveRequestConverter.convert` 转 `ShipmentNoticeSaveDTO`，再调 `App.save`（`@Transactional`）。\n3. `save` 调 `DeliveryFeignClient.getListByOrderNos` 查履约订单，校验 `ouCode` 非空，补全交付订单/客户/账套/合同版本/来源字段。\n4. `save` 调 `MasterDataFeignClient.generateShipmentNoticeSerialNumber` 生成流水号，委托 `doSave`。\n5. `doSave`：领域 `create` 构建头 → `generateOrderNo` 生成发货通知单号 → 头表 `save` 落库 → 非母单保存关联关系 → 行 `createLine` + `batchAdd` 落库。\n6. `doSave` 调 `validateShipmentTotalQuantityAndPower`：查头、查履约订单/履约订单行（Feign）、查发货通知行（DB），按 `fo.source == Salesforce` 校验产品与数量。\n7. 校验失败抛 `BusinessException`（事务回滚）；成功返回 `ShipmentNotice`，Controller 转 `ShipmentNoticeResponse` 返回。\n\n### 1.3 概览时序图（主路径）\n\n```plantuml\n@startuml\ntitle POST /shipment-notice/save — 概览\n\nskinparam sequence {\n    ArrowColor #334155\n    LifeLineBorderColor #94a3b8\n    ParticipantBackgroundColor #F8FAFC\n    ParticipantBorderColor #64748B\n    ActorBackgroundColor #1E293B\n    ActorFontColor #FFFFFF\n}\n\nactor \"调用方\" as Client\nbox \"接入层\" #E8F4FD\n    participant \"ShipmentNoticeController\" as Ctrl <<boundary>>\nend box\nbox \"应用层\" #FEF9C3\n    participant \"ShipmentNoticeApplicationService\" as App <<control>>\nend box\nbox \"领域与持久化\" #DCFCE7\n    participant \"ShipmentNotice\" as Domain <<entity>>\n    database \"DB\" as DB\nend box\nbox \"外部依赖\" #FCE7F3\n    participant \"DeliveryFeignClient\" as DeliveryFeign <<system>>\n    participant \"MasterDataFeignClient\" as MasterData <<system>>\nend box\n\nClient -> Ctrl: POST /shipment-notice/save\\nShipmentNoticeSaveRequest\nactivate Ctrl\nCtrl -> App: save(ShipmentNoticeSaveDTO)\\n@Transactional\nactivate App\nApp -> DeliveryFeign: getListByOrderNos(foNo)\nactivate DeliveryFeign\nDeliveryFeign --> App: FulfillmentOrderResponse\ndeactivate DeliveryFeign\nApp -> MasterData: generateShipmentNoticeSerialNumber\nactivate MasterData\nMasterData --> App: serialNumber\ndeactivate MasterData\nApp -> Domain: create / generateOrderNo\nApp -> DB: INSERT shipment_notice / _delivery / _line\nApp -> DeliveryFeign: getFoById / getFoLineList (校验)\nactivate DeliveryFeign\nDeliveryFeign --> App: fo / foLines\ndeactivate DeliveryFeign\nApp -> DB: SELECT shipment_notice_line (校验)\nApp --> Ctrl: ShipmentNotice\ndeactivate App\nCtrl --> Client: R<ShipmentNoticeResponse>\ndeactivate Ctrl\n\n@enduml\n```\n## 二、完整时序图\n\n本图覆盖接入 → 应用编排 → 领域/持久化 → 外部依赖（Feign）→ 校验的完整消息顺序；条件用 alt/opt，循环用 loop，同步调用均有返回与激活条。本接口为纯同步流程，无 AFTER_COMMIT 异步分发。\n\n```plantuml\n@startuml\ntitle POST /shipment-notice/save — 完整\n\nskinparam sequence {\n    ArrowColor #334155\n    LifeLineBorderColor #94a3b8\n    ParticipantBackgroundColor #F8FAFC\n    ParticipantBorderColor #64748B\n    ActorBackgroundColor #1E293B\n    ActorFontColor #FFFFFF\n}\n\nactor \"调用方\" as Client\nbox \"接入层\" #E8F4FD\n    participant \"ShipmentNoticeController\" as Ctrl <<boundary>>\nend box\nbox \"应用层\" #FEF9C3\n    participant \"ShipmentNoticeApplicationService\" as App <<control>>\nend box\nbox \"领域与持久化\" #DCFCE7\n    participant \"ShipmentNotice\" as Domain <<entity>>\n    participant \"ShipmentNoticeLine\" as LineDomain <<entity>>\n    participant \"ShipmentNoticeDelivery\" as DeliveryRel <<entity>>\n    participant \"ShipmentNoticeRepository\" as Repo\n    participant \"ShipmentNoticeLineRepository\" as LineRepo\n    participant \"ShipmentNoticeDeliveryRepository\" as DeliveryRepo\n    database \"DB\" as DB\nend box\nbox \"外部依赖\" #FCE7F3\n    participant \"DeliveryFeignClient\" as DeliveryFeign <<system>>\n    participant \"MasterDataFeignClient\" as MasterData <<system>>\nend box\n\nClient -> Ctrl: POST /shipment-notice/save\\nShipmentNoticeSaveRequest\nactivate Ctrl\nCtrl -> Ctrl: shipmentNoticeSaveRequestConverter.convert(add)\\n转为 ShipmentNoticeSaveDTO\nCtrl -> App: save(saveDTO)\nactivate App\nnote right of App: @Transactional(rollbackFor = Exception.class)\n\n== 阶段 A：查询履约订单并补全字段 ==\nApp -> DeliveryFeign: getListByOrderNos(\\n[fulfillmentOrderNo])\nactivate DeliveryFeign\nDeliveryFeign --> App: R<List<FulfillmentOrderResponse>>\\nfoList\ndeactivate DeliveryFeign\nApp -> App: fo = foList.get(0)\nopt fo.ouCode 为空\n    App --> Ctrl: throw BusinessException(账套为空)\nend\nApp -> App: 补全 deliveryOrderId / deliveryOrderNo\\n/ orgId / customer / contractVersion / foSource\n\n== 阶段 B：生成流水号 ==\nApp -> MasterData: generateShipmentNoticeSerialNumber()\nactivate MasterData\nMasterData --> App: serialNumber\ndeactivate MasterData\n\n== 阶段 C：doSave 落库 ==\nApp -> App: doSave(saveDTO, serialNumber, null)\nApp -> App: currentUser = SecurityContextHolder\\n.getCurrentEmployeeNumber()\nApp -> Domain: new ShipmentNotice().create(saveDTO, currentUser)\nactivate Domain\nDomain --> App: shipmentNotice\ndeactivate Domain\nApp -> Domain: generateOrderNo(serialNumber, null)\nactivate Domain\nnote right of Domain: DN + yyyymmdd + 4位流水号\\n(+ -序号 当 sortNumber 非空)\nDomain --> App: shipmentNoticeNo\ndeactivate Domain\n\nApp -> Repo: save(shipmentNotice)\nactivate Repo\nRepo -> Repo: convert 为 ShipmentNoticeDO\nRepo -> DB: INSERT shipment_notice\nDB --> Repo: ok\nRepo -> App: ok (回写 id)\ndeactivate Repo\n\nopt 非母单 (!checkIsParentOrder)\n    App -> DeliveryRel: ShipmentNoticeDelivery\\n.createByShipmentNotice(shipmentNotice)\n    activate DeliveryRel\n    DeliveryRel --> App: deliveryList\n    deactivate DeliveryRel\n    App -> DeliveryRepo: batchInsert(deliveryList)\n    activate DeliveryRepo\n    DeliveryRepo -> DB: INSERT shipment_notice_delivery\n    DB --> DeliveryRepo: ok\n    DeliveryRepo --> App: ok\n    deactivate DeliveryRepo\nend\n\nopt shipmentNoticeLines 非空\n    App -> App: fullSaveLineFields(\\nshipmentNotice, saveLines)\n    loop 遍历 saveDTO.shipmentNoticeLines\n        App -> Domain: createLine(item, currentUser)\n        activate Domain\n        Domain -> LineDomain: create(saveDTO, shipmentNotice, createdBy)\n        activate LineDomain\n        LineDomain --> Domain: line\n        deactivate LineDomain\n        Domain --> App: line\n        deactivate Domain\n    end\n    App -> LineRepo: batchAdd(shipmentNoticeLines)\n    activate LineRepo\n    LineRepo -> DB: INSERT shipment_notice_line\n    DB --> LineRepo: ok\n    LineRepo --> App: ok\n    deactivate LineRepo\nend\n== 阶段 D：校验发货数量与功率 ==\nApp -> App: validateShipmentTotalQuantityAndPower(\\nshipmentNotice.id)\nApp -> Repo: getId(shipmentId)\nactivate Repo\nRepo -> DB: SELECT shipment_notice\nDB --> Repo: shipmentNotice\nRepo --> App: shipmentNotice\ndeactivate Repo\nopt 母单 (checkIsParentOrder)\n    App -> App: return success（母单不校验）\nend\nApp -> DeliveryFeign: getFoById(fulfillmentOrderId)\nactivate DeliveryFeign\nDeliveryFeign --> App: R<FulfillmentOrderResponse> fo\ndeactivate DeliveryFeign\nopt fo == null\n    App --> Ctrl: throw BusinessException(履约订单不存在)\nend\nopt fo.cancelTag == YES 或 status == CANCELLED\n    App -> App: return success（DR 删除不校验）\nend\n\nApp -> DeliveryFeign: getFoLineList(\\nfulfillmentOrderId)\nactivate DeliveryFeign\nDeliveryFeign --> App: R<List<FulfillmentOrderLineResponse>>\\nfoLines\ndeactivate DeliveryFeign\nApp -> LineRepo: listByFulfillmentOrderId(\\nfulfillmentOrderId)\nactivate LineRepo\nLineRepo -> DB: SELECT shipment_notice_line\\n(该 FO 下所有通知单行)\nDB --> LineRepo: allLines\nLineRepo --> App: allLines\ndeactivate LineRepo\n\nalt fo.source == Salesforce\n    App -> LineRepo: getList(shipmentId)\n    activate LineRepo\n    LineRepo -> DB: SELECT shipment_notice_line\\n(本通知单行)\n    DB --> LineRepo: shipmentLines\n    LineRepo --> App: shipmentLines\n    deactivate LineRepo\n    App -> App: validateShipmentNoticeProduct(\\nfoNo, shipmentLines, foLines)\n    note right of App: 校验产品/功率必须来源于履约订单\n    opt 产品校验失败\n        App --> Ctrl: throw BusinessException(\\n相关履约订单中不存在以下产品)\n    end\n    App -> App: validateShipmentNoticeProductQuantity(\\nfoNo, allLines, foLines)\n    note right of App: 校验每个产品不超过履约订单剩余可发货数量\n    opt 数量校验失败\n        App --> Ctrl: throw BusinessException(\\n以下产品超出履约订单剩余可发货数量)\n    end\nelse fo.source 非 Salesforce\n    App -> App: return success（FO 履约订单不校验）\nend\n\nApp -> App: throwShipmentNoticeValidateException(\\nvalidateResult)\nnote right of App: 校验失败抛 BusinessException，事务回滚\\n已落库的头/关联/行全部回滚\nApp --> App: return shipmentNotice\n\nnote over App: @Transactional 提交点\\n校验通过则事务提交\nApp --> Ctrl: ShipmentNotice\ndeactivate App\nCtrl -> Ctrl: ShipmentNoticeConverter.toResponse(\\nshipmentNotice)\nCtrl --> Client: R<ShipmentNoticeResponse>\ndeactivate Ctrl\n\n@enduml\n```\n## 三、详细说明\n\n### 3.1 阶段拆解\n\n#### 阶段 A：查询履约订单并补全字段\n- 对应消息：`App -> DeliveryFeign: getListByOrderNos`、`App -> App: 补全字段`\n- 入参：`saveDTO.fulfillmentOrderNo`；出参：`FulfillmentOrderResponse fo`，补全 `deliveryOrderId/deliveryOrderNo/orgId/customer/contractVersion/foSource`\n- 关键校验：`fo.ouCode` 为空则抛 `BusinessException(账套为空)`\n- 代码举证：`ShipmentNoticeApplicationService.java:554-564`\n\n#### 阶段 B：生成流水号\n- 对应消息：`App -> MasterData: generateShipmentNoticeSerialNumber`\n- 出参：`serialNumber`（用于生成发货通知单号）\n- 代码举证：`ShipmentNoticeApplicationService.java:566`\n\n#### 阶段 C：doSave 落库\n- 对应消息：`App -> Domain: create/generateOrderNo`、`App -> Repo: save`、关联关系与行落库\n- 领域构建：`ShipmentNotice.create` 填充头字段 → `generateOrderNo` 生成 `DN+yyyymmdd+4位流水号`（`sortNumber` 非空时追加 `-序号`）\n- 头落库：`ShipmentNoticeRepositoryImpl.save` → `convert` → `shipmentNoticeMapper.insert`（MyBatis-Plus，主键回写）\n- 关联关系：非母单时 `ShipmentNoticeDelivery.createByShipmentNotice` → `batchInsert`（保存发货通知与组件订单关联）\n- 行落库：`fullSaveLineFields` 填充 sub-region → `shipmentNotice.createLine`（`ShipmentNoticeLine.create` 设置 `reqShipmentDate/scheduleShipmentTime` 默认当前日期）→ `batchAdd` 批量插入\n- 代码举证：`ShipmentNoticeApplicationService.java:649-675`、`ShipmentNotice.java:329-378`、`ShipmentNoticeRepositoryImpl.java:187-192`\n\n#### 阶段 D：校验发货数量与功率\n- 对应消息：`App -> Repo: getId`、`App -> DeliveryFeign: getFoById/getFoLineList`、`App -> LineRepo: listByFulfillmentOrderId/getList`、`validateShipmentNoticeProduct/Quantity`\n- 流程：查头 → 母单跳过 → 查履约订单（Feign）→ DR 删除跳过 → 查履约订单行（Feign）+ 查该 FO 下所有通知单行（DB）→ 按 `fo.source` 分流\n- Salesforce 来源：查本通知单行（DB）→ 校验产品/功率来源于履约订单 → 校验数量不超过履约订单剩余可发货数量\n- 非 Salesforce：不校验\n- 校验失败：`throwShipmentNoticeValidateException` 抛 `BusinessException`（合同总量超 MW / 产品不存在 / 超剩余数量三类错误）\n- 代码举证：`ShipmentNoticeApplicationService.java:3607-3651`、`580-595`\n\n### 3.2 分支、循环与并行\n\n| 片段 | 条件 / 集合 | 走向 | 举证 |\n|------|-------------|------|------|\n| opt | `fo.ouCode` 为空 | 抛账套为空异常 | `ShipmentNoticeApplicationService.java:556-558` |\n| opt | 非母单 `!checkIsParentOrder` | 保存发货通知-组件订单关联 | `ShipmentNoticeApplicationService.java:657-660` |\n| opt | `shipmentNoticeLines` 非空 | 行落库 | `ShipmentNoticeApplicationService.java:662-670` |\n| loop | 遍历 `shipmentNoticeLines` | 逐行 `createLine` | `ShipmentNoticeApplicationService.java:666-667` |\n| opt | 母单 `checkIsParentOrder` | 跳过校验 | `ShipmentNoticeApplicationService.java:3609-3614` |\n| opt | `fo == null` | 抛履约订单不存在 | `ShipmentNoticeApplicationService.java:3616-3618` |\n| opt | `fo.cancelTag==YES` 或 `status==CANCELLED` | DR 删除跳过校验 | `ShipmentNoticeApplicationService.java:3620-3626` |\n| alt | `fo.source == Salesforce` | 产品 + 数量校验 | `ShipmentNoticeApplicationService.java:3633-3644` |\n| opt | 产品校验失败 | 抛产品不存在异常 | `ShipmentNoticeApplicationService.java:3641-3643` |\n| opt | 数量校验失败 | 抛超剩余数量异常 | `ShipmentNoticeApplicationService.java:3644` |\n\n### 3.3 数据流向\n\n- 请求：`ShipmentNoticeSaveRequest` →（`shipmentNoticeSaveRequestConverter`）→ `ShipmentNoticeSaveDTO`（含 `List<ShipmentNoticeLineSaveDTO>`）\n- 履约补全：`DeliveryFeignClient.getListByOrderNos` → `FulfillmentOrderResponse` → 回填 `deliveryOrderId/deliveryOrderNo/orgId/customer/contractVersion/foSource`\n- 领域：`ShipmentNoticeSaveDTO` → `ShipmentNotice.create` → `ShipmentNotice`（头，`generateOrderNo` 生成单号）+ `ShipmentNoticeLine.create`（行）+ `ShipmentNoticeDelivery.createByShipmentNotice`（关联）\n- 持久化：`ShipmentNotice` → `shipment_notice` 表；`ShipmentNoticeLine` → `shipment_notice_line` 表；`ShipmentNoticeDelivery` → `shipment_notice_delivery` 表\n- 响应：`ShipmentNotice` →（`ShipmentNoticeConverter.toResponse`）→ `ShipmentNoticeResponse`\n\n### 3.4 事务与异常\n\n- **事务边界**：`save` 整体 `@Transactional(rollbackFor = Exception.class)`，覆盖阶段 A-D 全部 Feign 调用与落库。\n- **回滚**：阶段 A `ouCode` 为空、阶段 D `fo==null`、产品/数量校验失败 → 抛 `BusinessException`，已落库的头/关联/行整体回滚。\n- **事务内远程调用**：阶段 A `getListByOrderNos`、阶段 B `generateShipmentNoticeSerialNumber`、阶段 D `getFoById`/`getFoLineList` 均为事务内 Feign 调用，事务持有时间随远程响应增长。\n- **无 AFTER_COMMIT**：本接口不发布领域事件，无 `@TransactionalEventListener`，纯同步返回。\n\n### 3.5 风险与注意事项\n\n- **事务内多次远程调用**：单次保存触发 4 次 Feign 调用（`getListByOrderNos`、`generateShipmentNoticeSerialNumber`、`getFoById`、`getFoLineList`），事务持有时间长，长事务风险高；任一 Feign 超时/失败导致事务回滚，已落库数据丢失。\n- **流水号生成在事务内**：`generateShipmentNoticeSerialNumber` 在事务内调用，若后续校验失败回滚，已消耗的流水号不回收，可能造成流水号空洞。\n- **校验依赖远程数据**：发货数量校验依赖 `getFoLineList`（Feign）与 `listByFulfillmentOrderId`（DB），Feign 数据与 DB 数据的时间窗口可能导致校验偏差（并发场景下其他通知单正在写入）。\n- **N+1 / 远程放大**：`validateShipmentTotalQuantityAndPower` 内多次 DB 查询（`getId`、`listByFulfillmentOrderId`、`getList`）与 Feign 调用，批量场景下放大。\n- **幂等性**：接口无显式幂等键，重复提交产生多条发货通知单；`shipmentNoticeNo` 由流水号 + 日期生成，无去重保护。\n- **母单/子单差异**：母单跳过关联关系保存与数量校验，业务上需确认母单是否需要其他校验。\n\n## 四、证据不足项\n\n| 步骤 | 缺失原因 |\n|------|----------|\n| `fullSaveLineFields` 内 sub-region 填充的具体取值逻辑 | codegraph 仅给出方法签名，未展开内部实现，按「填充 sub-region 字段」概括 |\n| `ShipmentNoticeDelivery.createByShipmentNotice` 关联关系构建的具体字段 | 方法体未完整呈现，仅标注「创建关联」 |\n| `validateShipmentNoticeProduct` / `validateShipmentNoticeProductQuantity` 内部比对算法 | 方法体未完整呈现，仅按业务语义标注「校验产品/功率」「校验数量」 |\n| `DeliveryFeignClient` 各方法的 Feign 接口签名与目标路径 | Feign 接口定义未在本次输出中完整呈现，按业务语义命名 |\n| `shipmentNoticeSaveRequestConverter` 的字段映射     "content": "# OMS 订单管理系统 — 测试用例（PlantUML）\n\n> 数据源：逆向建模自 `oms-deliv-order` / `oms-master-data` / `oms-sale-order` / `oms-ship-notice` 等微服务源码与权限矩阵。\n> 本页内嵌 **4 张 PlantUML 用例图**：1 张总览 + 3 张分角色。图表源文经公共 PlantUML 服务渲染。\n\n## 一、用例总览图\n\n本图展示 OMS 系统全部人员角色（订单全链路管理员、OMS欧洲区运营、OMS中国区运营）、9 个外部集成系统（ERP / WMS / TMS / OTMS / Salesforce / BPM / IFS / MES / SCP）与 30 个用例之间的整体关系。Admin 泛化 Eu / Cn 两个运营角色；一键发送发货通知 include 调用发送 WMS / 发送 TMS；发送 WMS include 调用发送邮件；组件订单 BPM 审批 include 调用销售订单 BPM 审批。\n\n```plantuml\n@startuml\nleft to right direction\nskinparam rectangle<<system>> {\n    BackgroundColor #D6EAF8\n    BorderColor #5DADE2\n    FontColor #1B4F72\n}\nactor \"订单全链路管理员\" as Admin\nactor \"OMS欧洲区运营\" as EuOp\nactor \"OMS中国区运营\" as CnOp\nrectangle \"ERP\" as ERP <<system>>\nrectangle \"WMS\" as WMS <<system>>\nrectangle \"TMS\" as TMS <<system>>\nrectangle \"OTMS\" as OTMS <<system>>\nrectangle \"Salesforce\" as SF <<system>>\nrectangle \"BPM\" as BPM <<system>>\nrectangle \"IFS\" as IFS <<system>>\nrectangle \"MES\" as MES <<system>>\nrectangle \"SCP\" as SCP <<system>>\n\nrectangle \"OMS 订单管理系统\" {\n  package \"组件订单域\" {\n    usecase \"管理组件订单\" as UC1\n    usecase \"管理发货申请DR\" as UC2\n    usecase \"发起组件订单BPM审批\" as UC3\n    usecase \"净需求分量计算\" as UC4\n    usecase \"编辑DP关联\" as UC5\n    usecase \"查询DP排产计划\" as UC6\n    usecase \"生成DP分配报表\" as UC7\n    usecase \"查询收款与发票\" as UC8\n    usecase \"同步组件订单至SF\" as UC9\n    usecase \"查询库存预留\" as UC10\n    usecase \"查看首页可视化\" as UC11\n    usecase \"查询运营报表\" as UC12\n    usecase \"查询排产报表\" as UC13\n    usecase \"查询DP需求报表\" as UC14\n    usecase \"查询拍卖报表\" as UC15\n    usecase \"管理订单优先级规则\" as UC16\n  }\n  package \"销售订单域\" {\n    usecase \"管理销售订单SO\" as UC17\n    usecase \"发起销售订单BPM审批\" as UC18\n    usecase \"生成公司间转卖与关联交易\" as UC19\n    usecase \"管理采购订单PO\" as UC20\n    usecase \"同步销售订单至SF\" as UC21\n    usecase \"查询销售采购订单报表\" as UC22\n  }\n  package \"发货通知域\" {\n    usecase \"管理发货通知单\" as UC23\n    usecase \"发送发货通知至WMS\" as UC24\n    usecase \"发送发货通知至TMS\" as UC25\n    usecase \"一键发送发货通知\" as UC26\n    usecase \"发送发货通知邮件\" as UC27\n    usecase \"管理自提单\" as UC28\n    usecase \"Release海外订单\" as UC29\n    usecase \"管理库存预留变更\" as UC30\n  }\n  package \"主数据与系统管理\" {\n    usecase \"查询主数据\" as UC31\n    usecase \"查询系统消息\" as UC32\n    usecase \"管理邮件配置\" as UC33\n    usecase \"管理订单类型\" as UC34\n    usecase \"管理系统设置\" as UC35\n    usecase \"管理角色菜单权限用户\" as UC36\n  }\n}\n\nAdmin --> UC1\nAdmin --> UC2\nAdmin --> UC3\nAdmin --> UC16\nAdmin --> UC17\nAdmin --> UC23\nAdmin --> UC30\nAdmin --> UC33\nAdmin --> UC34\nAdmin --> UC35\nAdmin --> UC36\nEuOp --> UC1\nEuOp --> UC2\nEuOp --> UC3\nEuOp --> UC7\nEuOp --> UC17\nEuOp --> UC23\nEuOp --> UC29\nCnOp --> UC1\nCnOp --> UC2\nCnOp --> UC12\nCnOp --> UC13\nCnOp --> UC14\nCnOp --> UC15\nCnOp --> UC17\nCnOp --> UC23\nCnOp --> UC28\nCnOp --> UC29\n\nUC3 ..> UC18 : <<include>>\nUC9 ..> UC21 : <<include>>\nUC26 ..> UC24 : <<include>>\nUC26 ..> UC25 : <<include>>\nUC24 ..> UC27 : <<include>>\n\nERP --> UC1\nERP --> UC17\nWMS --> UC24\nWMS --> UC30\nTMS --> UC25\nOTMS --> UC23\nSF --> UC9\nSF --> UC21\nBPM --> UC3\nBPM --> UC18\nIFS --> UC8\nMES --> UC6\nSCP --> UC6\n\nAdmin <|-- EuOp\nAdmin <|-- CnOp\n@enduml\n```\n\n## 二、订单全链路管理员用例图\n\n订单全链路管理员是 OMS 的最高权限角色，继承欧洲区与中国区运营的全部业务用例权限，并额外独占系统管理类用例（邮件配置、订单类型管理、系统设置、订单优先级规则、角色 / 菜单 / 权限 / 用户管理）。\n\n```plantuml\n@startuml\nleft to right direction\nactor \"订单全链路管理员\" as Admin\nrectangle \"ERP\" as ERP <<system>>\nrectangle \"WMS\" as WMS <<system>>\nrectangle \"TMS\" as TMS <<system>>\nrectangle \"BPM\" as BPM <<system>>\nrectangle \"Salesforce\" as SF <<system>>\nrectangle \"IFS\" as IFS <<system>>\n\nrectangle \"OMS 系统\" {\n  usecase \"管理组件订单\" as A1\n  usecase \"管理销售订单SO\" as A2\n  usecase \"管理发货通知单\" as A3\n  usecase \"管理库存预留变更\" as A4\n  usecase \"管理订单优先级规则\" as A5\n  usecase \"管理邮件配置\" as A6\n  usecase \"管理订单类型\" as A7\n  usecase \"管理系统设置\" as A8\n  usecase \"管理角色菜单权限用户\" as A9\n}\n\nAdmin --> A1\nAdmin --> A2\nAdmin --> A3\nAdmin --> A4\nAdmin --> A5\nAdmin --> A6\nAdmin --> A7\nAdmin --> A8\nAdmin --> A9\n\nERP --> A1\nERP --> A2\nWMS --> A3\nWMS --> A4\nTMS --> A3\nBPM --> A1\nBPM --> A2\nSF --> A1\nSF --> A2\nIFS --> A4\n@enduml\n```\n\n## 三、OMS欧洲区运营用例图\n\nOMS欧洲区运营负责欧洲区域的订单全链路日常业务，覆盖组件订单、发货申请、DP 排产、销售 / 采购订单、发货通知、库存预留等运营用例，并独占\"生成DP分配报表（欧洲区DP分配报表）\"。该角色不包含中国区排产 / 拍卖类报表，也不包含系统管理类用例。\n\n```plantuml\n@startuml\nleft to right direction\nactor \"OMS欧洲区运营\" as EuOp\nrectangle \"ERP\" as ERP <<system>>\nrectangle \"WMS\" as WMS <<system>>\nrectangle \"TMS\" as TMS <<system>>\nrectangle \"BPM\" as BPM <<system>>\nrectangle \"Salesforce\" as SF <<system>>\n\nrectangle \"OMS 系统\" {\n  usecase \"管理组件订单\" as E1\n  usecase \"管理销售订单SO\" as E2\n  usecase \"管理采购订单PO\" as E3\n  usecase \"管理发货通知单\" as E4\n  usecase \"生成DP分配报表\" as E5\n  usecase \"发送发货通知至WMS\" as E6\n  usecase \"发送发货通知至TMS\" as E7\n  usecase \"Release海外订单\" as E8\n  usecase \"管理库存预留变更\" as E9\n}\n\nEuOp --> E1\nEuOp --> E2\nEuOp --> E3\nEuOp --> E4\nEuOp --> E5\nEuOp --> E6\nEuOp --> E7\nEuOp --> E8\nEuOp --> E9\n\nERP --> E1\nERP --> E2\nERP --> E3\nWMS --> E4\nWMS --> E6\nWMS --> E9\nTMS --> E4\nTMS --> E7\nBPM --> E1\nBPM --> E2\nSF --> E1\nSF --> E2\n@enduml\n```\n\n## 四、OMS中国区运营用例图\n\nOMS中国区运营负责中国区域的订单全链路日常业务，覆盖组件订单、发货申请、DP 排产、销售 / 采购订单、发货通知、自提单、库存预留等运营用例，并独占中国区报表类用例（运营报表、排产报表、DP需求报表、拍卖台账 / 出库报表）。该角色不包含\"生成DP分配报表（欧洲区）\"，也不包含系统管理类用例。\n\n```plantuml\n@startuml\nleft to right direction\nactor \"OMS中国区运营\" as CnOp\nrectangle \"ERP\" as ERP <<system>>\nrectangle \"WMS\" as WMS <<system>>\nrectangle \"TMS\" as TMS <<system>>\nrectangle \"BPM\" as BPM <<system>>\nrectangle \"Salesforce\" as SF <<system>>\n\nrectangle \"OMS 系统\" {\n  usecase \"管理组件订单\" as C1\n  usecase \"管理销售订单SO\" as C2\n  usecase \"管理采购订单PO\" as C3\n  usecase \"管理发货通知单\" as C4\n  usecase \"管理自提单\" as C5\n  usecase \"查询运营报表\" as C6\n  usecase \"查询排产报表\" as C7\n  usecase \"查询DP需求报表\" as C8\n  usecase \"查询拍卖报表\" as C9\n  usecase \"Release海外订单\" as C10\n}\n\nCnOp --> C1\nCnOp --> C2\nCnOp --> C3\nCnOp --> C4\nCnOp --> C5\nCnOp --> C6\nCnOp --> C7\nCnOp --> C8\nCnOp --> C9\nCnOp --> C10\n\nERP --> C1\nERP --> C2\nERP --> C3\nWMS --> C4\nTMS --> C4\nBPM --> C1\nBPM --> C2\nSF --> C1\nSF --> C2\n@enduml\n```\n\n## 五、角色—用例差异总结\n\n| 用例类别 | 管理员 Admin | 欧洲区 EuOp | 中国区 CnOp |\n|---|---|---|---|\n| 业务核心（订单 / 发货 / 库存） | ✓ | ✓ | ✓ |\n| 生成DP分配报表（欧洲区） | ✓ | ✓ | ✗ |\n| 运营报表 / 排产 / DP需求 / 拍卖报表 | ✓ | ✗ | ✓ |\n| 管理订单优先级规则 | ✓ | ✗ | ✗ |\n| 管理邮件配置 / 订单类型 / 系统设置 | ✓ | ✗ | ✗ |\n| 管理角色 / 菜单 / 权限 / 用户 | ✓ | ✗ | ✗ |\n\n> 鉴权说明：OMS 后端 Controller 未使用 `@PreAuthorize` 等方法级注解，鉴权在 `oms-gateway` 网关层基于资源路径统一拦截。",

    "content": "# OMS 系统架构图\n\n> 本架构图展示 OMS 订单管理系统从用户浏览器到后端微服务、再到外部业务系统的完整调用链路与部署关系。\n> 微服务：`oms-deliv-order`、`oms-master-data`、`oms-sale-order`、`oms-ship-notice`、`oms-website-ui`、`oms-gateway`。\n> 默认环境以 `dev` profile 为代表。\n\n## 系统架构图（Mermaid flowchart TB）\n\n```mermaid\nflowchart TB\n    User[\"用户浏览器\"]\n\n    subgraph WebNode[\"Web 节点（Nginx 容器）\"]\n        webUi[\"oms-website-ui<br/>Vue3 静态制品<br/>nginx:1.27-alpine:80\"]\n    end\n\n    subgraph GatewayNode[\"网关节点（JVM）\"]\n        gateway[\"oms-gateway<br/>app.jar<br/>Spring Cloud Gateway:80\"]\n    end\n\n    subgraph AppNode[\"OMS 应用服务节点（JVM x4）\"]\n        deliv[\"oms-deliv-order<br/>app.jar<br/>:8080 ctx=/delivery\"]\n        master[\"oms-master-data<br/>app.jar<br/>:8080 ctx=/master-data\"]\n        sale[\"oms-sale-order<br/>app.jar<br/>:8080 ctx=/sales\"]\n        ship[\"oms-ship-notice<br/>app.jar<br/>:8081 ctx=/shipment-notice\"]\n    end\n\n    subgraph NacosNode[\"Nacos 节点\"]\n        nacos[\"Nacos Server<br/>服务发现+配置中心<br/>:8848 namespace=oms\"]\n    end\n\n    subgraph DbNode[\"数据库节点（MySQL）\"]\n        dbDeliv[\"delivery_order_db\"]\n        dbMaster[\"master_data_db\"]\n        dbSale[\"sale_order_db\"]\n        dbShip[\"shipment_notice_db\"]\n    end\n\n    subgraph XxlNode[\"调度中心节点\"]\n        xxl[\"XXL-Job Admin<br/>:30011/xxl-job-admin\"]\n    end\n\n    subgraph StorageNode[\"对象存储节点（S3 兼容）\"]\n        s3[\"Trina TOS / S3<br/>bucket=s3omstest\"]\n    end\n\n    subgraph MailNode[\"邮件服务节点\"]\n        mail[\"SMTP 邮件服务器<br/>:25\"]\n    end\n\n    subgraph IamNode[\"认证授权节点\"]\n        iam[\"Trina IAM\"]\n        tasp[\"TASP 统一权限\"]\n    end\n\n    subgraph ApiGwNode[\"Trina API 网关（集成总线）\"]\n        apigw[\"tslapigw-uat<br/>承载多个 catalog 路由\"]\n    end\n\n    subgraph ExtNode[\"外部业务系统\"]\n        erp[\"ERP\"]\n        wms[\"WMS\"]\n        sf[\"Salesforce\"]\n        ifs[\"IFS\"]\n        mes[\"MES\"]\n        scp[\"SCP\"]\n        tms[\"TMS\"]\n        otms[\"OTMS\"]\n    end\n\n    subgraph BpmNode[\"BPM 流程引擎节点\"]\n        bpm[\"BPM<br/>10.40.38.71:88\"]\n    end\n\n    User -- \"HTTPS\" --> WebNode\n    WebNode -- \"HTTPS /api/**\" --> GatewayNode\n    GatewayNode -- \"lb:// HTTP Nacos路由\" --> deliv\n    GatewayNode -- \"lb:// HTTP Nacos路由\" --> sale\n    GatewayNode -- \"lb:// HTTP Nacos路由\" --> ship\n    GatewayNode -- \"lb:// HTTP Nacos路由\" --> master\n    GatewayNode -- \"HTTPS/IAM OAuth\" --> iam\n    gateway -- \"HTTPS/TASP\" --> tasp\n\n    deliv -- \"注册/配置 :8848\" --> NacosNode\n    master -- \"注册/配置 :8848\" --> NacosNode\n    sale -- \"注册/配置 :8848\" --> NacosNode\n    ship -- \"注册/配置 :8848\" --> NacosNode\n    gateway -- \"注册/配置 :8848\" --> NacosNode\n\n    deliv -- \"Feign lb HTTP\" --> ship\n    deliv -- \"Feign lb HTTP\" --> sale\n    deliv -- \"Feign lb HTTP\" --> master\n    sale -- \"Feign lb HTTP\" --> ship\n    sale -- \"Feign lb HTTP\" --> deliv\n    sale -- \"Feign lb HTTP\" --> master\n    ship -- \"Feign lb HTTP\" --> sale\n    ship -- \"Feign lb HTTP\" --> deliv\n    ship -- \"Feign lb HTTP\" --> master\n\n    deliv -- \"JDBC/3306\" --> dbDeliv\n    master -- \"JDBC/3306\" --> dbMaster\n    sale -- \"JDBC/3306\" --> dbSale\n    ship -- \"JDBC/3306\" --> dbShip\n\n    deliv -- \"HTTP 注册执行器\" --> XxlNode\n    master -- \"HTTP 注册执行器\" --> XxlNode\n    sale -- \"HTTP 注册执行器\" --> XxlNode\n    ship -- \"HTTP 注册执行器\" --> XxlNode\n\n    deliv -- \"HTTPS/S3\" --> StorageNode\n    sale -- \"HTTPS/S3\" --> StorageNode\n    ship -- \"HTTPS/S3\" --> StorageNode\n\n    sale -- \"SMTP/25\" --> MailNode\n    ship -- \"SMTP/25\" --> MailNode\n\n    deliv -- \"HTTPS\" --> ApiGwNode\n    master -- \"HTTPS\" --> ApiGwNode\n    sale -- \"HTTPS\" --> ApiGwNode\n    ship -- \"HTTPS\" --> ApiGwNode\n\n    ApiGwNode -- \"HTTPS\" --> erp\n    ApiGwNode -- \"HTTPS\" --> wms\n    ApiGwNode -- \"HTTPS\" --> sf\n    ApiGwNode -- \"HTTPS\" --> ifs\n    ApiGwNode -- \"HTTPS\" --> mes\n    ApiGwNode -- \"HTTPS\" --> scp\n    ApiGwNode -- \"HTTPS\" --> tms\n    ApiGwNode -- \"HTTPS\" --> otms\n\n    deliv -- \"HTTP\" --> BpmNode\n    sale -- \"HTTP\" --> BpmNode\n```\n\n## 节点说明\n\n| 节点 | 类型 | 部署内容 | 说明 |\n|---|---|---|---|\n| **Web 节点** | Docker 容器（nginx:1.27-alpine） | oms-website-ui 静态制品 | Vue3 + Vite 构建产物，Nginx 托管，监听 80；dev API 指向 `oms-api-dev.trinasolar.com/api` |\n| **网关节点** | JVM（Spring Boot） | oms-gateway `app.jar` | Spring Cloud Gateway，端口 80；按路径路由 `/api/delivery`、`/api/sales`、`/api/shipment-notice`、`/api/master-data` 到对应服务；集成 IAM 鉴权与 TASP 权限校验 |\n| **OMS 应用服务节点** | JVM（Java 17）x4 | 4 个微服务 `app.jar` | oms-deliv-order / oms-master-data / oms-sale-order / oms-ship-notice；均注册到 Nacos，使用 Feign 经 Nacos 负载均衡互调 |\n| **Nacos 节点** | 服务注册/配置中心 | Nacos Server | 端口 8848，namespace=oms；提供服务发现与配置共享 |\n| **数据库节点** | MySQL | 4 个 schema | delivery_order_db / master_data_db / sale_order_db / shipment_notice_db；dev 主机 `172.22.8.83:3306`；Flyway 迁移 |\n| **调度中心节点** | XXL-Job Admin | XXL-Job 调度平台 | 各服务以执行器注册（端口 9999），由 Admin 统一调度 |\n| **对象存储节点** | S3 兼容存储 | Trina TOS | bucket `s3omstest`，用于文件上传/下载 |\n| **邮件服务节点** | SMTP 服务器 | Trina 邮件 | 发件人 `S-OMS@trinasolar.com` |\n| **认证授权节点** | IAM + TASP | 统一登录与权限 | IAM OAuth 鉴权；TASP 统一权限校验 |\n| **Trina API 网关节点** | 集成总线 | tslapigw-uat | 统一承载对外部业务系统的 API 路由与鉴权 |\n| **BPM 流程引擎节点** | 流程引擎 | BPM 服务 | 被 deliv-order 与 sale-order 直接调用（未走 tslapigw） |\n\n## 关键调用链路\n\n### 用户登录 → 首页加载\n\n1. 用户浏览器 → `oms-website-ui` (HTTPS/443)\n2. `oms-website-ui` → `oms-gateway` (HTTPS `/api/**`)\n3. `oms-gateway` → IAM (OAuth 鉴权)\n4. `oms-gateway` → TASP (权限校验)\n5. `oms-gateway` → `oms-deliv-order` (Nacos lb 路由) → `/api/homepage/**`\n6. `oms-deliv-order` → MySQL (查询组件订单统计) + Feign → `oms-sale-order` / `oms-ship-notice` 聚合数据\n\n### 组件订单 BPM 审批\n\n1. 用户 → `oms-website-ui`\n2. → `oms-gateway` → `oms-deliv-order` `POST /api/delivery/delivery-orders/bpm-approval`\n4. `oms-deliv-order` → BPM Feign → `10.40.38.71:88/api/workflow/oms`\n5. BPM 回调 → `oms-deliv-order` 更新 `bpm_approval_status`\n\n### 发货通知一键发送\n\n1. 用户点击\"一键发送\" → `oms-ship-notice` `POST /api/shipment-notice/shipment-notices/issue-multi-lines`\n2. 主路径包含 WMS 下发（`issue-wms`）→ `WmsFeignClient.issueNotice` → tslapigw → WMS\n3. 主路径包含 TMS 下发（`issue-tms`）→ `TmsFeignClient.syncShipmentBillDetails` → tslapigw → TMS\n4. 主路径包含发送邮件（`send-multi-lines-mail`）→ SMTP `mail.trinasolar.com:25`\n\n## 网络协议汇总\n\n| 协议 | 用途 | 端口 |\n|---|---|---|\n| HTTPS/443 | 浏览器 → Web 节点、外部 API | 443 |\n| HTTP/80 | 网关 → 应用服务（Nginx 反代 / lb 路由） | 80 |\n| HTTP/8080 | 应用服务（`oms-deliv-order` / `oms-master-data` / `oms-sale-order`） | 8080 |\n| HTTP/8081 | 应用服务（`oms-ship-notice` dev） | 8081 |\n| HTTP/8848 | 微服务 → Nacos（注册 + 配置） | 8848 |\n| HTTP/30011 | XXL-Job Admin | 30011 |\n| HTTP/9999 | XXL-Job 执行器（各服务内嵌） | 9999 |\n| JDBC/3306 | 应用服务 → MySQL | 3306 |\n| SMTP/25 | 应用服务 → 邮件服务器 | 25 |\n| HTTPS | 应用服务 → S3 / tslapigw / IAM / TASP | 443 |\n| HTTP/88 | BPM 流程引擎 | 88 |",

    "content": "# 逻辑 ER 图（业务实体）\n\n> 本图从物理表抽象为业务实体（Entity），不关注字段细节与外键约束，聚焦于**业务概念之间的关系**。\n> 一个业务实体通常对应多张物理表（如\"组件订单\"实体包含主表 + 行项目表 + 附件表 + 审计表）。\n> 颜色：每个业务实体颜色按业务域区分：组件订单（蓝）/ 销售订单（绿）/ 发货通知（橙）/ 主数据（紫）/ 系统支撑（灰）。\n\n## 图例\n\n| 业务域 | 颜色 | 涉及服务 |\n|---|---|---|\n| 组件订单 | 蓝 | oms-deliv-order |\n| 销售订单 | 绿 | oms-sale-order |\n| 发货通知 | 橙 | oms-ship-notice |\n| 主数据 | 紫 | oms-master-data |\n| 系统支撑 | 灰 | 全部服务 |\n\n## 逻辑 ER 图\n\n```mermaid\nerDiagram\n    客户 {\n        客户编码 PK\n        客户名称\n        客户SF标识\n        税类\n        付款条件 FK\n        计费国家\n        收货国家\n        是否有效\n    }\n\n    供应商 {\n        供应商编码 PK\n        供应商名称\n        付款条件 FK\n        是否有效\n    }\n\n    物料 {\n        物料编码 PK\n        物料名称\n        物料类型\n        产品系列\n        规格型号\n        单位\n    }\n\n    仓库 {\n        仓库编码 PK\n        仓库名称\n        国家\n        区域\n    }\n\n    付款条件 {\n        付款条件编码 PK\n        付款条件名称\n        账期天数\n    }\n\n    组件订单 {\n        订单号 PK\n        客户 FK\n        父订单 FK\n        贸易方式\n        状态\n        合同版本\n        币种\n        业务实体\n        销售区域\n        BPM审批状态\n    }\n\n    组件订单行 {\n        行ID PK\n        组件订单 FK\n        物料 FK\n        数量\n        单价\n        含税单价\n        预计交货日期\n    }\n\n    发货申请 {\n        DR号 PK\n        组件订单 FK\n        客户 FK\n        仓库 FK\n        状态\n        申请日期\n    }\n\n    销售订单 {\n        SO号 PK\n        客户 FK\n        父SO号\n        订单日期\n        总额\n        币种\n        状态\n        BPM审批状态\n    }\n\n    销售订单行 {\n        行ID PK\n        销售订单 FK\n        物料 FK\n        数量\n        单价\n    }\n\n    采购订单 {\n        PO号 PK\n        关联SO号\n        供应商 FK\n        订单日期\n        总额\n        状态\n    }\n\n    发货通知单 {\n        通知单号 PK\n        销售订单 FK\n        组件订单 FK\n        客户 FK\n        仓库 FK\n        状态\n        下发WMS状态\n        下发TMS状态\n        发邮件状态\n    }\n\n    发货通知行 {\n        行ID PK\n        发货通知单 FK\n        物料 FK\n        数量\n        已发数量\n        柜号\n    }\n\n    自提单 {\n        自提单号 PK\n        销售订单 FK\n        客户 FK\n        仓库 FK\n        自提日期\n        状态\n    }\n\n    库存预留申请 {\n        申请号 PK\n        仓库 FK\n        物料 FK\n        客户 FK\n        申请类型\n        变更数量\n        状态\n    }\n\n    订单优先级规则 {\n        规则ID PK\n        规则名称\n        优先级因子\n        适用业务域\n        是否启用\n    }\n\n    邮件配置 {\n        配置ID PK\n        员工编码\n        业务类型\n        收件人\n        抄送\n    }\n\n    客户 ||--o{ 组件订单 : 下达\n    客户 ||--o{ 销售订单 : 下达\n    客户 ||--o{ 发货通知单 : 收件方\n    客户 ||--o{ 自提单 : 提货方\n    供应商 ||--o{ 采购订单 : 供货\n    物料 ||--o{ 组件订单行 : \"组成\"\n    物料 ||--o{ 销售订单行 : \"组成\"\n    物料 ||--o{ 发货通知行 : \"组成\"\n    仓库 ||--o{ 发货申请 : \"发出\"\n    仓库 ||--o{ 发货通知单 : \"发出\"\n    仓库 ||--o{ 自提单 : \"自提\"\n    付款条件 ||--o{ 客户 : \"约定\"\n    付款条件 ||--o{ 供应商 : \"约定\"\n    组件订单 ||--o{ 组件订单行 : \"包含\"\n    组件订单 ||--o{ 发货申请 : \"拆分\"\n    组件订单 ||--o{ 发货通知单 : \"驱动\"\n    销售订单 ||--o{ 销售订单行 : \"包含\"\n    销售订单 ||--o{ 采购订单 : \"触发\"\n    销售订单 ||--o{ 发货通知单 : \"驱动\"\n    销售订单 ||--o{ 自提单 : \"拆分\"\n    发货通知单 ||--o{ 发货通知行 : \"包含\"\n```\n\n## 业务实体—物理表对照\n\n| 业务实体 | 物理表（所属服务） |\n|---|---|\n| **客户** | `customer`, `customer_address`（oms-master-data） |\n| **供应商** | `vendor`（oms-master-data） |\n| **物料** | `material`, `material_category`（oms-master-data） |\n| **仓库** | `warehouse`（oms-master-data） |\n| **付款条件** | `payment_terms`（oms-master-data） |\n| **组件订单** | `delivery_order`, `delivery_order_line`, `delivery_order_attachment`, `delivery_order_audit`（oms-deliv-order） |\n| **发货申请** | `fulfillment_order`, `fulfillment_order_line`（oms-deliv-order） |\n| **销售订单** | `sales_order`, `sales_order_line`, `sales_order_attachment`（oms-sale-order） |\n| **采购订单** | `purchase_order`, `purchase_order_line`（oms-sale-order） |\n| **发货通知单** | `shipment_notice`, `shipment_notice_line`, `shipment_notice_cabinet`（oms-ship-notice） |\n| **自提单** | `pickup_order`, `pickup_order_line`（oms-ship-notice） |\n| **库存预留申请** | `inventory_reserved_change_apply`, `inventory_reserved_change_apply_line`（oms-ship-notice） |\n| **订单优先级规则** | `order_priority`, `order_priority_factor`（oms-deliv-order） |\n| **邮件配置** | `employee_mail_cfg`（oms-master-data） |\n\n## 核心业务关系\n\n| 关系 | 业务含义 | 关键操作 |\n|---|---|---|\n| 客户 → 组件订单 | 客户下达订单 | `DeliveryOrderController.save()` |\n| 组件订单 → 发货申请 | 组件订单拆分为发货申请 | `FulfillmentOrderController.createFromDO()` |\n| 组件订单 → 发货通知单 | 组件订单驱动发货通知 | `ShipmentNoticeController.createFromDO()` |\n| 销售订单 → 发货通知单 | 销售订单驱动发货通知 | `ShipmentNoticeController.createFromSO()` |\n| 销售订单 → 采购订单 | 销售订单触发关联采购 | `OrderRelatedTransactionsController.generateInternalPurchaseOrder()` |\n| 发货通知单 → WMS | 发货通知下发到 WMS | `ShipmentNoticeController.issueWms()` |\n| 发货通知单 → TMS | 发货通知下发到 TMS | `ShipmentNoticeController.issueTms()` |",

    "content": "# 物理 ER 图（核心表）\n\n> 数据源：TrinaSolar OMS 微服务项目（MySQL 8.0 / InnoDB / utf8mb4，Flyway 迁移脚本）。\n> 本系统所有表均**未定义物理外键约束**（FOREIGN KEY），表间关系为**逻辑关联**（通过 `xxx_id` / `xxx_no` 字段维护），图中的 FK 标注含义为**逻辑外键字段**。\n> Mermaid erDiagram 语法仅支持 PK/FK/UK 三种键标记；非空（NN）、自增（AI）等约束请见下方的「表结构说明」表。\n> 本图仅展示跨域核心实体（约 15 张），完整表数 127（交货订单 44 / 主数据 41 / 销售订单 17 / 发运通知 25）。\n\n## 图例\n\n- **PK**：主键\n- **FK**：逻辑外键（应用层维护）\n- **UK**：唯一（UNIQUE）\n\n## 物理 ER 图（核心表）\n\n```mermaid\nerDiagram\n    delivery_order {\n        id BIGINT PK\n        order_no VARCHAR(50) UK\n        parent_order_id BIGINT FK\n        parent_order_no VARCHAR(50)\n        order_name VARCHAR(256)\n        customer_code VARCHAR(50) FK\n        customer_name VARCHAR(200)\n        trade_mode VARCHAR(30)\n        status VARCHAR(30)\n        contract_version VARCHAR(100)\n        total_volums_mw DECIMAL\n        total_amount DECIMAL\n        currency_code VARCHAR(10)\n        ou_code VARCHAR(30)\n        sales_region VARCHAR(200)\n        sales_channel VARCHAR(50)\n        sales_rep_id VARCHAR(30)\n        bpm_approval_status VARCHAR(50)\n        bpm_process_instance_id VARCHAR(256)\n        remark TEXT\n        order_start_date DATETIME\n        created_by VARCHAR(50)\n        created_at DATETIME\n        updated_by VARCHAR(50)\n        updated_at DATETIME\n        is_del BOOL\n        version INT\n    }\n\n    delivery_order_line {\n        id BIGINT PK\n        delivery_order_id BIGINT FK\n        order_no VARCHAR(50) FK\n        product_id VARCHAR(30) FK\n        product_name VARCHAR(50)\n        product_version VARCHAR(50)\n        product_specifications VARCHAR(30)\n        price DECIMAL\n        price_with_vat DECIMAL\n        piece_quantity INT\n        expected_delivery_date DATETIME\n        mm_cable_length DECIMAL\n        m_cable_length DECIMAL\n        installation VARCHAR(100)\n        created_at DATETIME\n        is_del BOOLEAN\n    }\n\n    fulfillment_order {\n        id BIGINT PK\n        dr_no VARCHAR(50) UK\n        delivery_order_id BIGINT FK\n        delivery_order_no VARCHAR(50) FK\n        customer_code VARCHAR(50) FK\n        warehouse_code VARCHAR(30) FK\n        status VARCHAR(30)\n        request_date DATETIME\n        created_by VARCHAR(50)\n        created_at DATETIME\n        updated_at DATETIME\n        is_del BOOL\n    }\n\n    sales_order {\n        id BIGINT PK\n        so_no VARCHAR(50) UK\n        parent_so_no VARCHAR(50)\n        customer_code VARCHAR(50) FK\n        customer_name VARCHAR(200)\n        order_date DATETIME\n        total_amount DECIMAL\n        currency_code VARCHAR(10)\n        status VARCHAR(30)\n        bpm_approval_status VARCHAR(50)\n        bpm_process_instance_id VARCHAR(256)\n        contract_version VARCHAR(100)\n        sales_rep_id VARCHAR(30)\n        created_at DATETIME\n        updated_at DATETIME\n        is_del BOOL\n        version INT\n    }\n\n    sales_order_line {\n        id BIGINT PK\n        sales_order_id BIGINT FK\n        so_no VARCHAR(50) FK\n        product_id VARCHAR(30) FK\n        product_name VARCHAR(50)\n        piece_quantity INT\n        unit_price DECIMAL\n        total_amount DECIMAL\n        expected_delivery_date DATETIME\n        is_del BOOLEAN\n    }\n\n    purchase_order {\n        id BIGINT PK\n        po_no VARCHAR(50) UK\n        related_so_no VARCHAR(50)\n        vendor_code VARCHAR(50) FK\n        vendor_name VARCHAR(200)\n        order_date DATETIME\n        total_amount DECIMAL\n        currency_code VARCHAR(10)\n        status VARCHAR(30)\n        created_at DATETIME\n        is_del BOOLEAN\n    }\n\n    shipment_notice {\n        id BIGINT PK\n        notice_no VARCHAR(50) UK\n        sales_order_no VARCHAR(50) FK\n        delivery_order_no VARCHAR(50) FK\n        customer_code VARCHAR(50) FK\n        warehouse_code VARCHAR(30) FK\n        status VARCHAR(30)\n        issue_wms_status VARCHAR(30)\n        issue_tms_status VARCHAR(30)\n        send_mail_status VARCHAR(30)\n        issue_date DATETIME\n        carrier VARCHAR(100)\n        tracking_no VARCHAR(100)\n        created_by VARCHAR(50)\n        created_at DATETIME\n        updated_at DATETIME\n        is_del BOOL\n    }\n\n    shipment_notice_line {\n        id BIGINT PK\n        shipment_notice_id BIGINT FK\n        notice_no VARCHAR(50) FK\n        product_id VARCHAR(30) FK\n        piece_quantity INT\n        shipped_quantity INT\n        cabinet_no VARCHAR(50)\n        created_at DATETIME\n    }\n\n    inventory_reserved_change_apply {\n        id BIGINT PK\n        apply_no VARCHAR(50) UK\n        warehouse_code VARCHAR(30) FK\n        product_id VARCHAR(30) FK\n        customer_code VARCHAR(50) FK\n        apply_type VARCHAR(30)\n        quantity_change INT\n        status VARCHAR(30)\n        approved_by VARCHAR(50)\n        approved_at DATETIME\n        created_at DATETIME\n        is_del BOOL\n    }\n\n    pickup_order {\n        id BIGINT PK\n        pickup_no VARCHAR(50) UK\n        sales_order_no VARCHAR(50) FK\n        customer_code VARCHAR(50) FK\n        warehouse_code VARCHAR(30) FK\n        pickup_date DATETIME\n        status VARCHAR(30)\n        created_at DATETIME\n        is_del BOOL\n    }\n\n    customer {\n        id BIGINT PK\n        customer_code VARCHAR(50) UK\n        customer_name VARCHAR(200)\n        customer_sf_id VARCHAR(50)\n        tax_type VARCHAR(50)\n        payment_term_id VARCHAR(50) FK\n        bill_to_country_code VARCHAR(30)\n        ship_to_country_code VARCHAR(30)\n        is_active BOOL\n        created_at DATETIME\n    }\n\n    vendor {\n        id BIGINT PK\n        vendor_code VARCHAR(50) UK\n        vendor_name VARCHAR(200)\n        payment_term_id VARCHAR(50) FK\n        is_active BOOL\n        created_at DATETIME\n    }\n\n    material {\n        id BIGINT PK\n        product_id VARCHAR(30) UK\n        product_name VARCHAR(50)\n        product_category VARCHAR(30)\n        product_version VARCHAR(50)\n        product_specifications VARCHAR(30)\n        unit VARCHAR(30)\n        is_active BOOL\n        created_at DATETIME\n    }\n\n    warehouse {\n        id BIGINT PK\n        warehouse_code VARCHAR(30) UK\n        warehouse_name VARCHAR(100)\n        country_code VARCHAR(30)\n        region VARCHAR(100)\n        is_active BOOL\n        created_at DATETIME\n    }\n\n    payment_terms {\n        id BIGINT PK\n        payment_term_id VARCHAR(50) UK\n        payment_term_name VARCHAR(100)\n        days INT\n        is_active BOOL\n    }\n\n    delivery_order ||--o{ delivery_order_line : \"1:N\"\n    delivery_order ||--o{ fulfillment_order : \"1:N\"\n    sales_order ||--o{ sales_order_line : \"1:N\"\n    sales_order ||--o{ shipment_notice : \"1:N\"\n    shipment_notice ||--o{ shipment_notice_line : \"1:N\"\n    sales_order ||--o{ pickup_order : \"1:N\"\n    customer ||--o{ delivery_order : \"1:N\"\n    customer ||--o{ sales_order : \"1:N\"\n    customer ||--o{ shipment_notice : \"1:N\"\n    customer ||--o{ inventory_reserved_change_apply : \"1:N\"\n    vendor ||--o{ purchase_order : \"1:N\"\n    material ||--o{ delivery_order_line : \"1:N\"\n    material ||--o{ sales_order_line : \"1:N\"\n    material ||--o{ shipment_notice_line : \"1:N\"\n    warehouse ||--o{ fulfillment_order : \"1:N\"\n    warehouse ||--o{ shipment_notice : \"1:N\"\n    warehouse ||--o{ pickup_order : \"1:N\"\n    payment_terms ||--o{ customer : \"1:N\"\n    payment_terms ||--o{ vendor : \"1:N\"\n```\n\n## 表结构说明\n\n| 表名 | 所属服务 | 物理主键 | 逻辑外键示例 | 备注 |\n|---|---|---|---|---|\n| `delivery_order` | oms-deliv-order | `id` BIGINT | `parent_order_id`, `customer_code`, `sales_rep_id` | 组件订单主表 |\n| `delivery_order_line` | oms-deliv-order | `id` BIGINT | `delivery_order_id`, `product_id` | 组件订单行项目 |\n| `fulfillment_order` | oms-deliv-order | `id` BIGINT | `delivery_order_id`, `warehouse_code` | 发货申请 DR |\n| `sales_order` | oms-sale-order | `id` BIGINT | `customer_code`, `parent_so_no` | 销售订单 SO 主表 |\n| `sales_order_line` | oms-sale-order | `id`
